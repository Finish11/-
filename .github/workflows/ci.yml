name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка типов
        run: npm run typecheck

      - name: Сборка фронтенда
        run: npm run build

      - name: Сборка автономного демо (один HTML)
        run: npm run build:demo

      - name: Артефакт демо
        uses: actions/upload-artifact@v4
        with:
          name: pulsenet-demo-html
          path: demo-standalone.html
          retention-days: 14
