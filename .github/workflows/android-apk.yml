# Собирает Android APK (Capacitor + автономная демо-сборка) и кладёт его артефактом.
# Готовый файл: вкладка Actions → нужный запуск → раздел Artifacts → pulsenet-debug-apk.
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'vite.demo.config.ts'
      - 'demo.html'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/android-assets.mjs'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'vite.demo.config.ts'
      - 'demo.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Сборка debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Кэш Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Зависимости
        run: npm ci --no-audit --no-fund

      - name: Демо-сборка и синхронизация с Android
        run: npm run android:sync

      - name: Сборка APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Переименовать APK
        run: |
          mkdir -p apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "apk/pulsenet-${GITHUB_SHA::7}-debug.apk"
          ls -lh apk

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: pulsenet-debug-apk
          path: apk/*.apk
          retention-days: 30
          if-no-files-found: error
