# Собирает Android APK (Capacitor + автономная демо-сборка).
# Артефакт: Actions → Artifacts → pulsenet-debug-apk.
# Публичный файл: GitHub Releases, тег android-latest
#   https://github.com/<owner>/<repo>/releases/download/android-latest/pulsenet-debug.apk
name: Android APK

on:
  push:
    branches: [main, arena/fcf07acb-repo]
    paths:
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'vite.demo.config.ts'
      - 'demo.html'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/android-assets.mjs'
      - '.github/workflows/android-apk.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'android/**'
      - 'capacitor.config.ts'
      - 'vite.demo.config.ts'
      - 'demo.html'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    name: Сборка debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Android SDK уже установлен на ubuntu-latest (ANDROID_HOME задан).
      # Платформу 36 при необходимости достанавливаем через sdkmanager.
      - name: Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -n "$SDKMANAGER" ] && [ ! -d "$ANDROID_HOME/platforms/android-36" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null || true
          fi
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true

      - name: Кэш Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Зависимости
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Нативный SQLite для тестов
        run: npm rebuild better-sqlite3

      - name: Проверки TypeScript и боевой логики
        run: |
          npm run typecheck
          npm run typecheck:community
          npm run test:core
          npm run test:native
          npm run test:speed
          npm run test:routes
          npm run test:sync
          npm audit --omit=dev
          npm run build

      - name: Версия из package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          # versionName и монотонный versionCode — из одного скрипта, который
          # проверяется тестом: расхождение версии в APK и в заметках релиза
          # ломает обновление поверх установленного приложения.
          node scripts/app-version.mjs --build "$GITHUB_RUN_NUMBER"
          grep -n 'versionCode\|versionName' android/app/build.gradle

      - name: Демо-сборка и синхронизация с Android
        env:
          VITE_COMMUNITY_API_URL: ${{ vars.PULSENET_COMMUNITY_API_URL }}
        run: npm run android:sync

      - name: Сборка APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace > gradle.log 2>&1 || {
            code=$?
            tail -120 gradle.log
            exit $code
          }

      # В песочнице Arena архив логов Actions недоступен. На ошибке сохраняем
      # только текст Gradle во временный диагностический релиз, APK сюда не попадает.
      - name: Диагностика ошибки Gradle
        if: failure() && github.event_name != 'pull_request' && hashFiles('android/gradle.log') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete apk-build-log --yes --cleanup-tag > /dev/null 2>&1 || true
          gh release create apk-build-log \
            --target "${GITHUB_SHA}" \
            --title "Диагностика Gradle ${GITHUB_SHA::7}" \
            --notes-file android/gradle.log \
            --prerelease

      - name: Переименовать APK
        run: |
          mkdir -p apk
          # Имя стабильное, чтобы ссылка на релиз не менялась между сборками
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/pulsenet-debug.apk
          ls -lh apk

      - name: Загрузить APK
        uses: actions/upload-artifact@v4
        with:
          name: pulsenet-debug-apk
          path: apk/*.apk
          retention-days: 30
          if-no-files-found: error

      # Публикуем в Releases — оттуда файл скачивается без входа в GitHub.
      # На pull_request не публикуем, чтобы ревью не меняло релиз.
      - name: Опубликовать в Releases
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA_SHORT="${GITHUB_SHA::7}"
          VERSION="${APP_VERSION:-0.0.0}"
          RELEASE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/android-latest/pulsenet-debug.apk"
          # Журнал вставляется файлом, а не подстановкой в heredoc: обратные
          # кавычки и $ в тексте изменений иначе выполнились бы как команды.
          {
            printf 'Версия: %s\n\n' "${VERSION}"
            node scripts/release-notes.mjs
            printf '\nDebug-сборка приложения «ПульсСети» для Android: Capacitor 8 + автономное локальное хранилище.\n\n'
            printf 'Коммит: `%s`\n' "${SHA_SHORT}"
            printf 'Собрано: %s\n\n' "$(date -u '+%Y-%m-%d %H:%M UTC')"
            printf '**Установка:** скачайте `pulsenet-debug.apk` на телефон, откройте файл, разрешите установку из этого источника. Android 7.0 и новее.\n\n'
            printf '**Прямая ссылка:** %s\n\n' "${RELEASE_URL}"
            printf 'Подпись отладочная (debug keystore) — для тестирования и личной установки. Это диагностический инструмент, а не официальный источник данных о блокировках.\n'
          } > release-notes.md
          head -6 release-notes.md
          # Пересоздаём релиз, чтобы тег указывал на текущий коммит, а файл был свежим
          gh release delete android-latest --yes --cleanup-tag > /dev/null 2>&1 || true
          gh release create android-latest apk/pulsenet-debug.apk \
            --target "${GITHUB_SHA}" \
            --title "ПульсСети ${VERSION} для Android (${SHA_SHORT})" \
            --notes-file release-notes.md \
            --prerelease
